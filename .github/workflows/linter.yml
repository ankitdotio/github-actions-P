# GOAl : whenever someone changes a python code , the linter wil run
name: pythonLinter

on:
  push:
    paths: "*.py"

jobs:
  code:
    runs-on: ubuntu-latest
    steps:
      - name: clone the code 
        uses: actions/checkout@v7

      - name : installing python
        uses: actions/setup-python@v5
        with:
          python-version : "3.14"

      - name: installing the linter
        run: pip install ruff
        
      - name: check the file for linting
        run : ruff  check .
